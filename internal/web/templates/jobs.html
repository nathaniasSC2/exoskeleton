{{template "head" .}}<h1>Jobs</h1>
<table><thead><tr><th>#</th><th>status</th><th>task</th><th>dir</th><th>created</th><th>finished</th><th>cost</th></tr></thead><tbody>
{{range .Jobs}}<tr class="st-{{.Status}}"><td><a href="/job/{{.ID}}">{{.ID}}</a></td><td>{{.Status}}</td><td class="msg"><a href="/job/{{.ID}}">{{clip .Task 140}}</a></td><td><code>{{.Workdir}}</code></td><td>{{ts .Created}}</td><td>{{ts .Finished}}</td><td>{{usd .Cost}}</td></tr>
{{else}}<tr><td colspan=7 class="empty">No jobs yet.</td></tr>{{end}}</tbody></table>
{{template "foot" .}}
